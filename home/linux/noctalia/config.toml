# 桌面 Shell
[shell]
font_family = "Maple Mono NF CN"
panel_anchor_bar = "default"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = true

# 截图
[shell.screenshot]
annotate = true
copy_to_clipboard = true
save_to_file = false

# Dock
[dock]
enabled = true
launcher_position = "start"
position = "left"
reserve_space = false
show_dots = true
smart_auto_hide = true

# 日出日落调度
[location]
auto_locate = true

# 夜间模式
[nightlight]
enabled = true
temperature_day = 6700

# 主题
[theme]
source = "builtin"
builtin = "Catppuccin"
mode = "auto"

# 应用配色由 Home Manager 声明。
[theme.templates]
enable_builtin_templates = false
enable_community_templates = false

# 壁纸
[wallpaper]
directory = "~/Pictures/Wallpapers"

[wallpaper.default]
path = "~/Pictures/Wallpapers/nixos-1.png"

# 时钟
[widget.clock]
format = "{:%Y年%-m月%-d日 %p %I:%M %A}"
