# 桌面 Shell
[shell]
font_family = "Maple Mono NF CN"
panel_anchor_bar = "default"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = true

# Dock
[dock]
enabled = true
launcher_position = "start"
position = "left"
reserve_space = false
show_dots = true
smart_auto_hide = true

# 日出日落调度
[location]
auto_locate = true

[nightlight]
enabled = true
temperature_day = 6700

# 自动亮暗与壁纸配色
[theme]
builtin = "Noctalia"
community_palette = "Catppuccin Mocha Blue"
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-content"

# 模板选择独立于应用安装声明。
[theme.templates]
enable_builtin_templates = true
enable_community_templates = true
builtin_ids = ["btop", "ghostty", "kitty", "niri"]
community_ids = [
  "telegram",
  "zed",
  "fastfetch",
  "zellij",
  "fcitx5",
  "fzf",
  "herdr",
  "lazygit",
]

# 壁纸
[wallpaper]
directory = "~/Pictures/Wallpapers"

[wallpaper.default]
path = "~/Pictures/Wallpapers/nixos-1.png"

# 时钟
[widget.clock]
format = "{:%Y年%-m月%-d日 %p %I:%M %A}"
