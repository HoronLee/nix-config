# 桌面 Shell
[shell]
font_family = "Maple Mono NF CN"
panel_anchor_bar = "default"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = true

# 截图
[shell.screenshot]
annotate = true
copy_to_clipboard = true
save_to_file = false

# Dock
[dock]
enabled = true
launcher_position = "start"
position = "left"
reserve_space = false
show_dots = true
smart_auto_hide = true

# 日出日落调度
[location]
auto_locate = true

# 夜间模式
[nightlight]
enabled = true
temperature_day = 6700

# 主题
[theme]
source = "builtin"
builtin = "Catppuccin"
mode = "auto"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4"]
enable_community_templates = true
community_ids = ["telegram"]

# 壁纸
[wallpaper]
directory = "~/Pictures/Wallpapers"
directory_light = "~/Pictures/Wallpapers/light"
directory_dark = "~/Pictures/Wallpapers/dark"

[wallpaper.default]
path = "~/Pictures/Wallpapers/nixos-long.jpg"

# 启动时按已解析的主题选择壁纸；默认图作为 IPC 就绪前的回退。
# 主题在亮暗之间切换时立即替换壁纸。
[hooks]
started = '''
case "$(noctalia msg theme-mode-get)" in
  light) noctalia msg wallpaper-set "$HOME/Pictures/Wallpapers/light/nixos-catppuccin-latte-2560x1440.png" ;;
  dark) noctalia msg wallpaper-set "$HOME/Pictures/Wallpapers/dark/nixos-catppuccin-mocha-2560x1440.png" ;;
esac
'''
theme_mode_changed = '''
case "$NOCTALIA_THEME_MODE" in
  light) noctalia msg wallpaper-set "$HOME/Pictures/Wallpapers/light/nixos-catppuccin-latte-2560x1440.png" ;;
  dark) noctalia msg wallpaper-set "$HOME/Pictures/Wallpapers/dark/nixos-catppuccin-mocha-2560x1440.png" ;;
esac
'''

# 时钟
[widget.clock]
format = "{:%Y年%-m月%-d日 %p %I:%M %A}"
