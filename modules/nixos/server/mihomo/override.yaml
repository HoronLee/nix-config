mixed-port: 7890
ipv6: false
allow-lan: false
log-level: info
unified-delay: true
tcp-concurrent: true

secret: "CHANGE_ME"
external-controller: 127.0.0.1:9090

profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
